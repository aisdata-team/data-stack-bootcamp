      - {repo: orchestration, path: DECISIONS.md, commit: ea713797fe70d68779f9116577dda81dddcc4e6f}
  - id: P5-B-03
    pool: B
    unit: null
    type: artifact
    stem: "You grep to the entry `## 2026-09-08 (b)` and find this line directly under its heading. How should you now read that entry?"
    artifact: |
      > **Superseded by 2026-09-18 (c)** ("The operator queue gets its own tab; the landing page keeps the count"). Only the placement changed — the queue renders on its own "Waiting on you" tab, with the count on the tab and a one-line pointer left on the landing page; everything else in this entry stands.
    options:
      - text: "It stands except on where the queue is shown; read 2026-09-18 (c) for that"
        correct: true
        rationale: "A supersession banner names the later entry and says in one line what changed; here only the placement did, so read the 2026-09-18 (c) entry for where the queue is shown."
      - text: "It is void: skip it and read only the 2026-09-18 (c) entry instead"
        correct: false
        rationale: "The banner says everything else in the entry stands, so skipping it loses the rest of the decision."
      - text: "It is marked for deletion and will be pruned from DECISIONS.md"
        correct: false
        rationale: "A superseded entry gets a banner, never a deletion; DECISIONS.md is never pruned and its headings never move."
      - text: "Any CLAUDE.md rule that cites it is now obsolete"
        correct: false
        rationale: "CLAUDE.md's operator-marker rule cites both 2026-09-08 (b) and 2026-09-18 (c); the rule stands with both entries behind it."
    sources:
      - {repo: orchestration, path: DECISIONS.md, commit: ea713797fe70d68779f9116577dda81dddcc4e6f}
      - {repo: orchestration, path: CLAUDE.md, commit: ea713797fe70d68779f9116577dda81dddcc4e6f}
