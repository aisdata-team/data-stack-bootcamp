  - id: P5-B-02
    pool: B
    unit: null
    type: artifact
    stem: "A roadmap row cites `DECISIONS.md` (2026-09-21 (d)). You run this grep in the orchestration repo. Which line starts the cited entry?"
    artifact: |
      $ grep -n "^## 2026-09-21" DECISIONS.md
      382:## 2026-09-21 (b) — The six-month ways-of-working retrospective is filed, not chatted: a placement on the sense-making rubric, a register row for the operating model, and two follow-ups (ORCH-102, RM-233, RM-234)
      399:## 2026-09-21 (d) — `dbt-214@`'s row on `data_snapshots` is removed, not demoted: it granted nothing, and RM-232 removed the reason for it (RM-229, RM-232, ORCH-48)
      443:## 2026-09-21 (c) — MAP Fluency will be loaded by scripting the vendor's UI export; the DEX and the Data API are both closed (RM-162, ORCH-103)
      470:## 2026-09-21 — MART-4 covers the whole home project, and the read that got it there found a third vendor grant and a key-bearer at OWNER over children's DOBs (RM-229, RM-230, ORCH-48, WH-04)
    options:
      - text: "Line 399"
        correct: true
        rationale: "The citation names the heading lettered (d), and only line 399 carries that letter."
      - text: "Line 470"
        correct: false
        rationale: "It is the fourth hit, but position in the file is not the letter; it is a bare `## 2026-09-21` heading, which CLAUDE.md says consumes the (a) slot, not (d)."
      - text: "Line 382"
        correct: false
        rationale: "It is the first hit, but it is lettered (b), not (d); being first says nothing about the letter."
      - text: "Line 443"
        correct: false
        rationale: "That heading is lettered (c); the letter in the citation has to match the letter in the heading."
    sources:
