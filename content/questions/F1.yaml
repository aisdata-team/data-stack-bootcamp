# F1 · SQL on BigQuery — Stage 0 diagnostic bank.
# Forms A and B are parallel: item 1 = BigQuery identifiers and quoting,
# item 2 = reading a join + aggregate, item 3 = window functions / QUALIFY.
skill: F1
confidence:
  A:
    - "I could write a query that joins students to their enrollments and counts courses per student, including students with none."
    - "I could keep only the most recent row per student from a table that holds several rows for each student."
  B:
    - "I could explain why joining two tables made my row count go up or down."
    - "I could rank rows within each group and keep only the top-ranked ones."
items:
  - id: F1-A-01
    pool: A
    unit: null
    type: mcq
    stem: "In BigQuery (GoogleSQL), which FROM clause reads the table `students` in dataset `training` of project `ais-sandbox`?"
    artifact: null
    options:
      - text: "from `ais-sandbox.training.students`"
        correct: true
        rationale: "Backticks quote an identifier, and the full project.dataset.table path goes inside one pair of them."
      - text: "from \"ais-sandbox.training.students\""
        correct: false
        rationale: "In Postgres double quotes mark an identifier, but in BigQuery they make a string literal, so this is not a table reference."
      - text: "from 'ais-sandbox.training.students'"
        correct: false
        rationale: "Single quotes make a string literal in every SQL dialect; a string is not a table."
      - text: "from [ais-sandbox:training.students]"
        correct: false
        rationale: "Square brackets with a colon are BigQuery's old legacy-SQL syntax (and look like SQL Server), not valid GoogleSQL."
    sources: []
  - id: F1-A-02
    pool: A
    unit: null
    type: artifact
    stem: "Given the two small tables in the comments, what does this query return?"
    artifact: |
      -- ais-sandbox.training.students      -- ais-sandbox.training.enrollments
      --   student_id                       --   student_id | course_id
      --   S1001                            --   S1001      | MATH9
      --   S1002                            --   S1001      | ENG9
      --   S1003                            --   S1002      | MATH9

      select s.student_id, count(e.course_id) as courses
      from `ais-sandbox.training.students` as s
      left join `ais-sandbox.training.enrollments` as e
        on s.student_id = e.student_id
      group by s.student_id
    options:
      - text: "S1001: 2, S1002: 1, S1003: 0"
        correct: true
        rationale: "The left join keeps S1003 with a NULL course_id, and COUNT(column) skips NULLs, so S1003 counts 0."
      - text: "S1001: 2, S1002: 1 (S1003 does not appear)"
        correct: false
        rationale: "That is what an inner join would return; a left join keeps every row from the left table."
      - text: "S1001: 2, S1002: 1, S1003: 1"
        correct: false
        rationale: "That is what COUNT(*) would give, because it counts the NULL-padded row; COUNT(e.course_id) does not."
      - text: "S1001: 1, S1002: 1, S1003: 1"
        correct: false
        rationale: "A left join does not cap matches at one per left row; S1001 matches two enrollment rows."
    sources: []
  - id: F1-A-03
    pool: A
    unit: null
    type: artifact
    stem: "What does this query return for student S1001?"
    artifact: |
      -- ais-sandbox.training.enrollment_history
      --   student_id | status    | updated_at
      --   S1001      | Enrolled  | 2026-08-01
      --   S1001      | Withdrawn | 2026-09-15
      --   S1001      | Enrolled  | 2026-09-15
      --   S1002      | Enrolled  | 2026-08-20

      select student_id, status, updated_at
      from `ais-sandbox.training.enrollment_history`
      qualify row_number() over (partition by student_id order by updated_at desc) = 1
    options:
      - text: "One row dated 2026-09-15, but which status is not defined"
        correct: true
        rationale: "ROW_NUMBER always gives exactly one row the number 1, but the two 2026-09-15 rows tie on updated_at, so which of them gets it is arbitrary and can change between runs; add a tie-breaking column to the ORDER BY to make it deterministic."
      - text: "Both rows dated 2026-09-15, because they tie"
        correct: false
        rationale: "That is what RANK would return; ROW_NUMBER never gives two rows the same number, so only one row per student passes the filter."
      - text: "One row, Withdrawn, because it is listed first"
        correct: false
        rationale: "A table has no inherent row order, so the order the rows are listed in does not decide which tied row is numbered 1."
      - text: "An error, because ROW_NUMBER cannot break a tie"
        correct: false
        rationale: "ROW_NUMBER always assigns distinct numbers, breaking ties arbitrarily; it never fails on a tie."
    sources: []
  - id: F1-B-01
    pool: B
    unit: null
    type: artifact
    stem: "BigQuery rejects this query with a syntax error before running it. What is the cause?"
    artifact: |
      select count(*) as rows from `ais-sandbox.training.students`
    options:
      - text: "ROWS is a reserved keyword, so it cannot be an unquoted alias."
        correct: true
        rationale: "ROWS is reserved (it is used in window frames such as ROWS BETWEEN), so the parser stops at it; the warehouse's house rule is to alias counts as total_rows instead."
      - text: "COUNT(*) needs a column name, such as COUNT(student_id)."
        correct: false
        rationale: "COUNT(*) is valid and counts every row; the problem is the alias, not the function."
      - text: "An aggregate needs a GROUP BY clause."
        correct: false
        rationale: "An aggregate with no GROUP BY is valid and returns one row for the whole table."
      - text: "Column aliases must be written in single quotes."
        correct: false
        rationale: "Single quotes make a string literal; an alias that needs quoting uses backticks."
    sources:
      - {repo: warehouse, path: CLAUDE.md, commit: 9efbb8b979e3be90ded565726fba8da7597fd115}
  - id: F1-B-02
    pool: B
    unit: null
    type: artifact
    stem: "Given the two small tables in the comments, what does this query return?"
    artifact: |
      -- ais-sandbox.training.students         -- ais-sandbox.training.absences
      --   student_id | grade_level_number     --   student_id | absence_date
      --   S1001      | 9                      --   S1001      | 2026-09-01
      --   S1002      | 9                      --   S1001      | 2026-09-02
      --   S1003      | 10                     --   S1003      | 2026-09-01

      select s.grade_level_number, count(*) as absences
      from `ais-sandbox.training.students` as s
      join `ais-sandbox.training.absences` as a
        on s.student_id = a.student_id
      group by s.grade_level_number
    options:
      - text: "grade 9: 2, grade 10: 1"
        correct: true
        rationale: "The inner join drops S1002 (no absences) and gives S1001 two rows, so grade 9 counts 2 and grade 10 counts 1."
      - text: "grade 9: 3, grade 10: 1"
        correct: false
        rationale: "That would be a LEFT JOIN with COUNT(*), which keeps S1002 as a NULL-padded row; a plain JOIN is an inner join."
      - text: "grade 9: 1, grade 10: 1"
        correct: false
        rationale: "That counts distinct students (COUNT(DISTINCT s.student_id)); COUNT(*) counts the joined rows."
      - text: "An error, because student_id is used but not in the GROUP BY"
        correct: false
        rationale: "Only non-aggregated columns in the SELECT list must be grouped; a column used only in the join condition does not."
    sources: []
  - id: F1-B-03
    pool: B
    unit: null
    type: artifact
    stem: "How many rows does this query return?"
    artifact: |
      -- ais-sandbox.training.scores
      --   student_id | assessment | score
      --   S1001      | MATH       | 88
      --   S1001      | ENG        | 88
      --   S1001      | SCI        | 75
      --   S1002      | MATH       | 91

      select student_id, assessment, score
      from `ais-sandbox.training.scores`
      qualify rank() over (partition by student_id order by score desc) = 1
    options:
      - text: "3"
        correct: true
        rationale: "RANK gives tied rows the same rank, so both of S1001's 88s are rank 1, plus S1002's single row."
      - text: "2"
        correct: false
        rationale: "That would be ROW_NUMBER, which breaks ties to give exactly one row per student; RANK keeps ties."
      - text: "1"
        correct: false
        rationale: "PARTITION BY student_id ranks within each student, not across the whole table."
      - text: "4"
        correct: false
        rationale: "QUALIFY does filter: it keeps only rows whose rank is 1, which drops S1001's SCI row."
    sources: []
