# F3 · Git and GitHub — Stage 0 diagnostic bank.
# Forms A and B are parallel: item 1 = getting a local change to GitHub
# (commit vs push vs pull request), item 2 = reading a diff,
# item 3 = merge conflicts.
skill: F3
confidence:
  A:
    - "I could take a change from a new branch to an open pull request on GitHub."
    - "I could read conflict markers in a file and say which version came from which branch."
  B:
    - "I could read a diff and say exactly which lines a change adds and removes."
    - "I could finish a merge after fixing a conflicted file, without committing the conflict markers."
items:
  - id: F3-A-01
    pool: A
    unit: null
    type: mcq
    stem: "Following this repo's practice of branching before you touch any file, you ran `git switch -c fix-attendance-filter`, edited one file, committed it (1 file changed) and ran `git push -u origin fix-attendance-filter`, which succeeded. Your reviewer says there is still nothing for them to review. What is missing?"
    artifact: null
    options:
      - text: "A pull request from fix-attendance-filter into main"
        correct: true
        rationale: "The push put the branch and its commit on GitHub, but a reviewer reviews a pull request; until one is opened from the branch into main there is nothing to review."
      - text: "git commit again, because the push sent nothing"
        correct: false
        rationale: "The commit reported 1 file changed and the push succeeded, so the commit is already on GitHub."
      - text: "git merge main, to put the change onto main first"
        correct: false
        rationale: "Merging into main is what a reviewed pull request ends with; doing it first would skip the review entirely."
      - text: "git pull, so that GitHub can see the new branch"
        correct: false
        rationale: "Pull brings other people's commits down to you; the push already put your branch on GitHub."
    sources: []
  - id: F3-A-02
    pool: A
    unit: null
    type: artifact
    stem: "What does this change do?"
    artifact: |
      diff --git a/models/staging/stg_students.sql b/models/staging/stg_students.sql
      --- a/models/staging/stg_students.sql
      +++ b/models/staging/stg_students.sql
      @@ -8,6 +8,6 @@ renamed as (
           select
               cast(student_id as string) as student_id,
               first_name,
      -        grade_level
      +        cast(grade_level as int64) as grade_level_number
           from source
       )
    options:
      - text: "It replaces grade_level with an INT64 column named grade_level_number."
        correct: true
        rationale: "The - line is removed and the + line added in its place, so the output no longer has a column called grade_level; the unmarked lines are unchanged context."
      - text: "It adds grade_level_number as a new column and keeps grade_level."
        correct: false
        rationale: "A line starting with - is deleted, not kept as context."
      - text: "It removes the cast and goes back to a plain grade_level column."
        correct: false
        rationale: "This reads the diff backwards: - is the old version (a/) and + is the new version (b/)."
      - text: "It changes six lines of the model, lines 8 to 13."
        correct: false
        rationale: "The @@ header counts the whole hunk shown, including unchanged context lines; only one line actually changes."
    sources: []
  - id: F3-A-03
    pool: A
    unit: null
    type: artifact
    stem: "You are on your branch fix-attendance-filter and ran `git merge main`. Which statement about this part of the file is correct?"
    artifact: |
      $ git merge main
      Auto-merging models/staging/stg_attendance.sql
      CONFLICT (content): Merge conflict in models/staging/stg_attendance.sql
      Automatic merge failed; fix conflicts and then commit the result.

      (excerpt of models/staging/stg_attendance.sql)
      <<<<<<< HEAD
          where attendance_status = 'Absent'
      =======
          where attendance_status in ('Absent', 'Excused')
      >>>>>>> main
    options:
      - text: "The top line is your branch's version; the bottom line is main's."
        correct: true
        rationale: "HEAD is the branch you are on, and the name after >>>>>>> is the branch being merged in; you choose the result and delete all three marker lines."
      - text: "The top line is main's version, because main is the original."
        correct: false
        rationale: "HEAD always means your current branch, whichever branch that is."
      - text: "The top line is the original; the bottom is Git's proposed result."
        correct: false
        rationale: "Both halves are competing edits; Git proposes no result, which is why it stopped and asked you."
      - text: "Git has already kept the bottom line; the top is left only for reference."
        correct: false
        rationale: "Until you edit the file, it contains both versions and the markers, which is not valid SQL."
    sources: []
  - id: F3-B-01
    pool: B
    unit: null
    type: mcq
    stem: "You ran `git commit` on your branch fix-attendance-filter and it reported 1 file changed, but the pull request page on GitHub shows no new commit. What is missing?"
    artifact: null
    options:
      - text: "git push, to send the new commit to the branch on GitHub"
        correct: true
        rationale: "A commit lives only in your local repository until you push it."
      - text: "git add, to stage the change again"
        correct: false
        rationale: "Staging happens before a commit; once committed, git add has nothing more to do for that change."
      - text: "git pull, to sync with GitHub"
        correct: false
        rationale: "Pull brings other people's commits down to you; it never sends yours up."
      - text: "A reviewer's approval, which makes new commits appear"
        correct: false
        rationale: "Pushed commits show on a pull request at once; approval is about merging, not visibility."
    sources: []
  - id: F3-B-02
    pool: B
    unit: null
    type: artifact
    stem: "What does this change do to the rows the model returns?"
    artifact: |
      diff --git a/models/staging/stg_enrollments.sql b/models/staging/stg_enrollments.sql
      --- a/models/staging/stg_enrollments.sql
      +++ b/models/staging/stg_enrollments.sql
      @@ -14,4 +14,5 @@ filtered as (
           select *
           from renamed
           where enrollment_status = 'Enrolled'
      +      and school_year = 2026
       )
    options:
      - text: "It narrows the rows: they must be Enrolled and in school year 2026."
        correct: true
        rationale: "Only the + line is new; the existing where line stays, and AND can only narrow the result, so the model returns the same rows or fewer."
      - text: "It replaces the Enrolled filter with a filter on school year 2026."
        correct: false
        rationale: "The where line has no - in front of it, so it is unchanged context, not removed."
      - text: "It adds the 2026 rows to the output alongside the Enrolled rows."
        correct: false
        rationale: "That would be OR; AND requires both conditions, so it removes rows rather than adding them."
      - text: "It adds a new column called school_year to the output."
        correct: false
        rationale: "The line is part of the where clause, which filters rows; columns are chosen in the select list."
    sources: []
  - id: F3-B-03
    pool: B
    unit: null
    type: artifact
    stem: "A merge stopped with a conflict. What must you do to finish it?"
    artifact: |
      $ git status
      On branch fix-attendance-filter
      You have unmerged paths.
        (fix conflicts and run "git commit")
        (use "git merge --abort" to abort the merge)

      Unmerged paths:
        (use "git add <file>..." to mark resolution)
        both modified:   models/staging/stg_attendance.sql

      no changes added to commit (use "git add" and/or "git commit -a")
    options:
      - text: "Fix the file and delete the markers, then git add and git commit."
        correct: true
        rationale: "Edit the file to the content you want and remove the <<<<<<< ======= >>>>>>> lines; git add then marks it resolved, and the commit completes the merge."
      - text: "Run git add and git commit now, leaving the file as it is."
        correct: false
        rationale: "Git would accept it, but the <<<<<<< ======= >>>>>>> markers would be committed into the SQL."
      - text: "Run git push; GitHub resolves conflicts on the server."
        correct: false
        rationale: "Push sends only finished commits; the unfinished merge stays in your local repository, and GitHub does not resolve it for you."
      - text: "Delete the file and run git pull again to fetch a clean copy."
        correct: false
        rationale: "Deleting the file throws away both sides' changes, and Git refuses to pull while a merge is still unfinished."
    sources: []
  # --- unit checks (pool: unit) ---
  - id: F3-U-01
    pool: unit
    unit: F3-01
    type: mcq
    stem: You edited notes.md, ran `git add notes.md` and `git commit`, and the commit succeeded. You then pushed your branch and opened a pull request into main. What should the PR's Files changed tab show?
    artifact: null
    options:
    - text: Only notes.md, with your one new line marked +
      correct: true
      rationale: Files changed is the diff between your branch and main, so it lists only the file you changed and shows your added line with a +, just as git diff did before you committed.
    - text: Every file in the repo, with notes.md highlighted
      correct: false
      rationale: The tab lists only files the branch changed; if more than one appears, your editor saved something extra.
    - text: The whole of notes.md, with no + or - markers
      correct: false
      rationale: It shows a diff, not the file; unchanged lines appear only as context around your change.
    - text: Only the commit message you wrote for the change
      correct: false
      rationale: Commit messages are on the Commits tab and in the PR's conversation; Files changed shows the lines themselves.
    sources: []
  - id: F3-U-02
    pool: unit
    unit: F3-01
    type: artifact
    stem: Reading this diff, what did the change do?
    artifact: "--- a/notes.md\n+++ b/notes.md\n@@ -3,3 +3,3 @@\n - first line\n-- learner-a was here on 2026-10-01\n+- learner-a was here on 2026-10-02\n - last line\n"
    options:
    - text: 'Replaced one line: the date changed from 1 to 2 October'
      correct: true
      rationale: In a diff an edit is shown as the old line removed (-) and the new line added (+).
    - text: Added a new line and kept the old one
      correct: false
      rationale: The - line means the old one was removed.
    - text: Deleted two lines
      correct: false
      rationale: Only one line starts with -; the + line is an addition.
    - text: Added a new first line and a new last line
      correct: false
      rationale: Lines that start with a space are unchanged context shown around the edit; only - and + lines changed.
    sources: []
  - id: F3-U-03
    pool: unit
    unit: F3-01
    type: mcq
    stem: A PR in the orchestration repo shows no CI checks at all, ten minutes after it was opened. What should you check first?
    artifact: null
    options:
    - text: Whether the PR has a merge conflict
      correct: true
      rationale: GitHub runs no PR workflows on a conflicted head, so a conflicted PR shows zero checks (orchestration CLAUDE.md).
    - text: Nothing; CI is just slow, so keep waiting
      correct: false
      rationale: Zero checks is not slowness; a session that waits for them waits forever.
    - text: Re-run the tests on your own machine
      correct: false
      rationale: Local tests pass or fail on their own; they don't explain why GitHub started no checks.
    - text: Re-run the CI workflows from the Actions tab
      correct: false
      rationale: There is no run to re-run; GitHub started none for the conflicted head, and it will start none until the conflict is resolved.
    sources:
    - repo: orchestration
      path: CLAUDE.md
      commit: ea713797fe70d68779f9116577dda81dddcc4e6f
