# The skills map. Every unit, lab and question is tagged to one skill id here.
# Source: the approved design spec, orchestration repo
# docs/superpowers/specs/2026-09-25-data-stack-training-course-design.md
#
# units       planned unit count (60–90 minutes each); 0 = outline only
# audience    all | data | it — who the skill's units are written for
# diagnostic  whether the skill is placed by the stage diagnostic
#
# Stage 0 is the data team's default entry; IT reaches it only through the
# stage-0 screener. Stage 4 is optional and outlined only.

stages:
  - {stage: 0, title: Foundations, graduate_can: "Work at the level the rest of the course assumes", default_for: [data]}
  - {stage: 1, title: Partner, graduate_can: "Explain the stack end to end, trace a field from source to dashboard, find why something is the way it is", default_for: [data, it]}
  - {stage: 2, title: Operator, graduate_can: "Run and recover the stack; keeps standing production access", default_for: [data, it]}
  - {stage: 3, title: Reviewer, graduate_can: "Independently review agent-authored changes against their requirements and the repo conventions", default_for: [data, it]}
  - {stage: 4, title: Author, graduate_can: "Author changes by hand or by directing Claude Code", default_for: []}

skills:
  # ── Stage 0 · Foundations ──────────────────────────────────────────────
  - {id: F1, stage: 0, title: "SQL on BigQuery", units: 5, audience: all, prerequisites: [], diagnostic: true}
  - {id: F2, stage: 0, title: "The command line", units: 2, audience: all, prerequisites: [], diagnostic: true}
  - {id: F3, stage: 0, title: "Git and GitHub", units: 2, audience: all, prerequisites: [F2], diagnostic: true}
  - {id: F4, stage: 0, title: "Docker, compose and the VM", units: 2, audience: all, prerequisites: [F2], diagnostic: true}
  - {id: F5, stage: 0, title: "GCP projects, IAM and secrets", units: 2, audience: all, prerequisites: [], diagnostic: true}

  # ── Stage 1 · Partner ──────────────────────────────────────────────────
  - {id: P1, stage: 1, title: "The stack end to end", units: 1, audience: all, prerequisites: [], diagnostic: true}
  - {id: P2, stage: 1, title: "Warehouse layers and modelling", units: 2, audience: all, prerequisites: [P1, F1], diagnostic: true}
  - {id: P3, stage: 1, title: "Trace a field from dashboard to source", units: 1, audience: all, prerequisites: [P2], diagnostic: true}
  - {id: P4, stage: 1, title: "The nightly run: jobs, schedules and sensors", units: 1, audience: all, prerequisites: [P1], diagnostic: true}
  - {id: P5, stage: 1, title: "Reading the record", units: 1, audience: all, prerequisites: [C1], diagnostic: true}
  - {id: P6, stage: 1, title: "Personal data in this stack", units: 1, audience: all, prerequisites: [P1], diagnostic: true}
  - {id: C1, stage: 1, title: "The operating model", units: 1, audience: all, prerequisites: [], diagnostic: true}
  - {id: C2, stage: 1, title: "Asking the repo with Claude Code", units: 1, audience: all, prerequisites: [C1], diagnostic: true}

  # ── Stage 2 · Operator ─────────────────────────────────────────────────
  - {id: O1, stage: 2, title: "The Dagster UI", units: 1, audience: all, prerequisites: [P4], diagnostic: true}
  - {id: O2, stage: 2, title: "Restart vs recreate vs rebuild", units: 1, audience: all, prerequisites: [F4], diagnostic: true}
  - {id: O3, stage: 2, title: "Deploying", units: 1, audience: all, prerequisites: [O2, F3], diagnostic: true}
  - {id: O4, stage: 2, title: "Triaging a failed nightly run", units: 2, audience: all, prerequisites: [O1], diagnostic: true}
  - {id: O5, stage: 2, title: "Sensors and cursors", units: 1, audience: all, prerequisites: [O1], diagnostic: true}
  - {id: O6, stage: 2, title: "Secrets and responsible access", units: 1, audience: all, prerequisites: [F5], diagnostic: true}
  - {id: O7, stage: 2, title: "Backup and restore", units: 1, audience: all, prerequisites: [O2], diagnostic: true}
  - {id: C3, stage: 2, title: "The automations", units: 1, audience: all, prerequisites: [C2], diagnostic: true}
  - {id: C4, stage: 2, title: "Claude Code during an incident", units: 1, audience: all, prerequisites: [C2, O4], diagnostic: true}

  # ── Stage 3 · Reviewer ─────────────────────────────────────────────────
  - {id: R1, stage: 3, title: "Anatomy of a PR here", units: 1, audience: all, prerequisites: [F3], diagnostic: true}
  - {id: R2, stage: 3, title: "Reading a dbt diff against the conventions", units: 2, audience: all, prerequisites: [R1, P2], diagnostic: true}
  - {id: R3, stage: 3, title: "Tests that cannot fail", units: 2, audience: all, prerequisites: [R2], diagnostic: true}
  - {id: R4, stage: 3, title: "Reviewing the ledger", units: 1, audience: all, prerequisites: [P5], diagnostic: true}
  - {id: C5, stage: 3, title: "How Claude is set up here", units: 2, audience: all, prerequisites: [C3], diagnostic: true}
  - {id: C6, stage: 3, title: "The independent reviewer", units: 1, audience: all, prerequisites: [C5, R1], diagnostic: true}

  # ── Stage 4 · Author (optional, outline only) ──────────────────────────
  - {id: A1, stage: 4, title: "A new dbt model", units: 0, audience: all, prerequisites: [R2], diagnostic: false}
  - {id: A2, stage: 4, title: "A new dlt stream", units: 0, audience: all, prerequisites: [O4], diagnostic: false}
  - {id: C7, stage: 4, title: "Directing Claude Code", units: 0, audience: all, prerequisites: [C6], diagnostic: false}
